[project]
name = "datio"
version = "0.1.0"
description = "Plataforma de reportería de redes sociales y pauta — Geeks Ecuador / Stack-Studio"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "tenacity>=8.5",
    "PyJWT[crypto]>=2.9",
    "google-auth>=2.34",
    "litellm>=1.50",
    "playwright>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "asyncpg-stubs>=0.29",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["api"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

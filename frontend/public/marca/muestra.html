<!doctype html><html lang="es"><head><meta charset="utf-8"><title>DatIO · marca</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Outfit,system-ui,sans-serif;background:#f3f3f5;padding:40px;display:grid;gap:28px;grid-template-columns:1fr 1fr}
.c{border-radius:24px;padding:40px;display:grid;place-items:center;min-height:220px}
.blanco{background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.oscuro{background:linear-gradient(135deg,#1F1F2E,#0F0F17)}
.rojo{background:linear-gradient(135deg,#C8102E,#7a0a1c)}
.celeste{background:linear-gradient(135deg,#e0f6fb,#fff)}
.fila{display:flex;gap:28px;align-items:center}
h6{margin:0 0 12px;font-weight:300;color:#71717a;font-size:13px;letter-spacing:.08em;text-transform:uppercase;grid-column:1/-1}
</style></head><body>
<h6>Logo principal · fondo claro</h6>
<div class="c blanco"><img src="logo.svg" width="320"></div>
<div class="c celeste"><img src="logo.svg" width="320"></div>
<h6>Versión en blanco · fondos oscuros y de marca</h6>
<div class="c oscuro"><img src="logo-blanco.svg" width="320"></div>
<div class="c rojo"><img src="logo-blanco.svg" width="320"></div>
<h6>Isotipo · favicon, app, avatar</h6>
<div class="c blanco"><div class="fila"><img src="isotipo.svg" width="96"><img src="isotipo.svg" width="48"><img src="isotipo.svg" width="32"><img src="isotipo.svg" width="16"></div></div>
<div class="c oscuro"><div class="fila"><img src="isotipo.svg" width="96"><img src="isotipo.svg" width="48"><img src="isotipo.svg" width="32"><img src="isotipo.svg" width="16"></div></div>
</body></html>

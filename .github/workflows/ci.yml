name: CI
on: [push, pull_request]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: datio
          POSTGRES_PASSWORD: datio
          POSTGRES_DB: datio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U datio" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://datio:datio@localhost:5432/datio
      CLAVE_CIFRADO: clave-solo-para-ci
      CRON_SECRET: cron-solo-para-ci
      SUPABASE_URL: https://ci.supabase.co
      SUPABASE_JWT_SECRET: secreto-jwt-solo-para-ci-con-largo-suficiente-32b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "backend[dev]"
      - name: Aplicar esquema y seeds
        run: |
          for f in sql/001_schema_inicial.sql sql/002_usuarios_llm_uso.sql sql/seeds/metricas.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - run: ruff check .
        working-directory: backend
      - run: mypy
        working-directory: backend
      - run: pytest -q
        working-directory: backend

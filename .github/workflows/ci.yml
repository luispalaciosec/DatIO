name: CI
on:
  push:
    branches: [main]
  pull_request:

# Los nombres de los jobs (`backend`, `frontend`) son estables: se marcan como checks
# obligatorios en la protección de main.
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: datio
          POSTGRES_PASSWORD: datio
          POSTGRES_DB: datio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U datio" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://datio:datio@localhost:5432/datio
      CLAVE_CIFRADO: clave-solo-para-ci
      CRON_SECRET: cron-solo-para-ci
      SUPABASE_URL: https://ci.supabase.co
      SUPABASE_JWT_SECRET: secreto-jwt-solo-para-ci-con-largo-suficiente-32b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar dependencias fijadas (con hashes)
        run: |
          pip install --require-hashes -r backend/requirements-dev.lock
          pip install --no-deps -e backend
      - name: Aplicar TODAS las migraciones compatibles y los seeds (B-2)
        run: scripts/aplicar_sql.sh "$DATABASE_URL"
      - run: ruff check .
        working-directory: backend
      - run: ruff format --check .
        working-directory: backend
      - run: mypy
        working-directory: backend
      - name: Tests (la suite completa con base; ninguno se salta por falta de esquema)
        run: pytest -q -rs
        working-directory: backend
      - name: Tests sin base (R-4)
        run: env -u DATABASE_URL pytest -q
        working-directory: backend
      - name: Auditoría de dependencias Python
        run: |
          pip install pip-audit
          pip-audit --require-hashes --disable-pip -r backend/requirements.lock

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build
      - name: Auditoría de dependencias (falla desde severidad moderada)
        run: npm audit --audit-level=moderate
